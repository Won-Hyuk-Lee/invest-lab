[project]
name = "invest-lab"
version = "0.1.0"
description = "Local research workspace for KOSPI stocks and Korea-listed ETFs"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
  "python-dotenv>=1.0,<2",
  "tzdata>=2025.1",
  "numpy>=2,<3",
  "scikit-learn>=1.6,<2",
  "pyarrow>=19,<24",
  "websockets>=14,<17",
  "cryptography>=44,<50",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
